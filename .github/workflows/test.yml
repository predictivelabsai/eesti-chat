name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: MCP server tests (recorded fixtures)
        run: python -m pytest tests/test_mcp_server.py -q
      - name: Live upstream smoke test
        run: python -m pytest tests/test_mcp_server.py -q --run-integration -k live
        continue-on-error: true
